---
dataset_id:
  type: 'String'
  required: true
  help: 'Cohort identifier used for the output directory and library filename'
mzml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV with sample_name,fraction_id,mzML columns; one raw fraction per row'
idxml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV with sample_name,idXML columns; one merged identification file per sample'
fractionated:
  type: 'Bool'
  default: false
  help: 'Allow multiple mzML fractions per sample and split merged idXMLs with IDRipper'
idxml_score_type:
  type: 'String'
  default: 'ProtLoom PEP'
  help: 'Exact idXML primary score type or PeptideHit metadata key to read'
easypqp_score_type:
  type: 'String'
  choices: ['PEP', 'q-value']
  default: 'PEP'
  help: 'Meaning of the selected score; use the exact score type required by EasyPQP'
psm_tsv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Cohort-level EasyPQP psm.tsv report'
peptide_tsv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Cohort-level EasyPQP peptide.tsv report'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Root output directory'
save_intermediate_files:
  type: 'Bool'
  default: false
  help: 'Publish per-run PSM and peak pickle files'
easypqp_version:
  type: 'String'
  default: '0.1.59'
  help: 'EasyPQP container version'
docker_image_easypqp:
  type: 'String'
  required: false
  help: 'EasyPQP container image; defaults to ghcr.io/theboutroslab/easypqp:0.1.59'
openms_version:
  type: 'String'
  default: '3.5.0'
  help: 'OpenMS version used for IDRipper'
docker_image_openms:
  type: 'String'
  required: false
  help: 'OpenMS container image; defaults to ghcr.io/theboutroslab/openms-thirdparty:3.5.0'
work_dir:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Nextflow working directory; prefer scratch space for large mzML inputs'
apptainer_library:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Apptainer library directory'
apptainer_cache:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Apptainer cache directory'
base_resource_update:
  type: 'ResourceUpdateNamespace'
  required: false
  help: 'User-defined process memory and CPU adjustments'
  elements:
    memory:
      type: 'ResourceUpdateList'
      required: false
      help: 'Memory adjustments'
    cpus:
      type: 'ResourceUpdateList'
      required: false
      help: 'CPU adjustments'
resource_allocation_profile_tag:
  type: 'String'
  choices: ['default']
  default: 'default'
  help: 'Process-specific resource allocation profile'
